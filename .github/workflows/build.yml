name: Build and Test
on:
    push:
        branches:
            - master
    pull_request:
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'
            - name: Install
              run: pnpm install --frozen-lockfile
            # Offline tests only — no network, no token, no deployed API required.
            # The production API suite runs separately in test-with-prod.yml
            # so SDK changes are never gated on an API deploy.
            - name: Test
              run: pnpm test
            - name: Build
              run: pnpm build
