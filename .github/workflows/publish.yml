name: Publish Package to npm
on:
    release:
        types: [published]
permissions:
    id-token: write
    contents: read
jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            # Unit tests only. Publishing must not depend on the live API, or a
            # release that legitimately runs ahead of the API deploy would be
            # blocked. Run `test:prod` against a deployed API separately.
            - name: Test
              run: pnpm test
            - name: Build
              run: pnpm build
            - name: Publish to npm
              run: npm publish --access public
