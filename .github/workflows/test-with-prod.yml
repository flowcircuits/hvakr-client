name: Test with Prod
# Runs the network-backed suite against a real HVAKR API. Kept OFF the
# build/publish critical path on purpose: the SDK frequently lands ahead of the
# matching API deploy, so these tests must be triggered deliberately rather than
# gating every push or release.
on:
    workflow_dispatch:
        inputs:
            api_url:
                description: 'Base URL to test against (defaults to https://api.hvakr.com)'
                required: false
                type: string
jobs:
    test-with-prod:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'
            - name: Install
              run: pnpm install --frozen-lockfile
            - name: Test with prod
              run: |
                  if [ -z "$HVAKR_ACCESS_TOKEN" ]; then
                      echo "HVAKR_ACCESS_TOKEN secret is required to test with prod."
                      exit 1
                  fi
                  pnpm test:prod
              env:
                  HVAKR_ACCESS_TOKEN: ${{ secrets.HVAKR_ACCESS_TOKEN }}
                  HVAKR_CLIENT_API_URL: ${{ inputs.api_url }}
